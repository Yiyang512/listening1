<!-- Payhip / website embed: Hemiya French Listening -->
<iframe
  src="https://yiyang512.github.io/listening1/listening.html"
  width="100%"
  height="900"
  style="border: none; overflow: hidden; max-width: 1200px; margin: 0 auto; display: block; background: transparent;"
  scrolling="no"
  id="reviewFrame"
  frameborder="0"
  title="Hemiya French Listening Practice"
  allow="speech-synthesis"
></iframe>
<script>
(function () {
  window.addEventListener('message', function (event) {
    var data = event.data || {};
    if (data.type !== 'hemiya-listen-resize' || !data.height) return;
    var frame = document.getElementById('reviewFrame');
    if (frame) frame.style.height = Math.max(700, data.height + 24) + 'px';
  });
})();
</script>
